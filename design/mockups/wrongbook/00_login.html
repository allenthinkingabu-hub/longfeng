<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="design-spec" content="P00.spec.md@v1" />
<title>P00 · 登录 · AI 错题本</title>
<style>
  /* ── Design tokens (mirrors design/system/tokens/*.json) ─────────────── */
  :root {
    /* L1 Apple base · color */
    --tkn-color-white:               #ffffff;
    --tkn-color-primary-DEFAULT:     #0071e3;
    --tkn-color-primary-link:        #0066cc;  /* 亮底链接 */
    --tkn-color-brand-wechat:        #07C160;  /* IRON RULE 1 EXCEPTION · wechat-brand · ONLY for B3 wechat CTA */
    /* L1 typography */
    --tkn-font-display: 'SF Pro Display','PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif;
    --tkn-font-text:    'SF Pro Text','PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif;
    --tkn-type-display-hero-size:    36px;
    --tkn-type-display-hero-weight:  600;
    --tkn-type-body-size:            17px;
    --tkn-type-body-emphasis-weight: 600;
    --tkn-type-link-size:            14px;
    --tkn-type-micro-size:           12px;
    /* L1 spacing (4pt grid) */
    --tkn-spacing-xs:  4px;
    --tkn-spacing-sm:  8px;
    --tkn-spacing-12:  12px;
    --tkn-spacing-md:  16px;
    --tkn-spacing-lg:  24px;
    --tkn-spacing-xl:  32px;
    --tkn-spacing-2xl: 48px;
    /* L1 radius */
    --tkn-radius-sm:   8px;
    --tkn-radius-md:   16px;
    --tkn-radius-pill: 980px;
    /* L1 shadow */
    --tkn-shadow-focus: 0 0 0 2px #0071e3;
    /* L1 motion */
    --tkn-motion-ease-standard: cubic-bezier(0.25,0.46,0.45,0.94);
    --tkn-motion-dur-fast:      150ms;
    --tkn-motion-dur-base:      250ms;
    /* L2 warmth */
    --tkn-gradient-aurora:        linear-gradient(135deg, #4F6FFF 0%, #7B5FFF 50%, #B85FFF 100%);
    --tkn-color-warm-elevated:    #ffffff;
    --tkn-color-warm-text-primary:   #1d1d1f;                    /* near-black */
    --tkn-color-warm-text-secondary: rgba(29,29,31,0.64);
    --tkn-color-warm-text-tertiary:  rgba(29,29,31,0.48);
    --tkn-shadow-warm-card:       0 1px 2px rgba(44,42,38,0.06), 0 8px 24px rgba(31,58,147,0.18);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html,body{
    background:#e5e5ea;
    font-family:var(--tkn-font-text);
    color:var(--tkn-color-warm-text-primary);
  }
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 0;}

  /* ── Phone shell 393×852 ──────────────────────────────────────────── */
  .phone{
    position:relative;width:393px;height:852px;
    background:#000;
    border-radius:54px;
    box-shadow:inset 0 0 0 6px #111, 0 30px 60px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .phone::before{
    content:"";position:absolute;left:50%;top:11px;
    transform:translateX(-50%);width:126px;height:37px;
    background:#000;border-radius:20px;z-index:50;
  }

  /* ── B1 Status bar ─────────────────────────────────────────────────── */
  .statusbar{
    position:absolute;top:0;left:0;right:0;height:54px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 var(--tkn-spacing-xl);
    font-size:var(--tkn-type-body-size);font-weight:var(--tkn-type-body-emphasis-weight);
    z-index:40;color:var(--tkn-color-warm-text-primary);
  }
  .statusbar .time{margin-top:12px;font-family:var(--tkn-font-display);}
  .statusbar .icons{margin-top:12px;display:flex;gap:6px;align-items:center;font-size:13px;}

  /* ── Page background — gradient-aurora ─────────────────────────────── */
  .page{
    position:absolute;inset:0;
    background:var(--tkn-gradient-aurora);
    z-index:10;
    display:flex;flex-direction:column;
    padding:54px var(--tkn-spacing-lg) var(--tkn-spacing-xl);
  }
  /* aurora 上层柔光 + 暖光，让极光层次更丰富 */
  .page::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.18), transparent 40%),
      radial-gradient(circle at 20% 80%, rgba(255,200,140,0.14), transparent 45%);
    pointer-events:none;z-index:1;
  }

  /* ── B2 Logo zone (top 1/3) ────────────────────────────────────── */
  .logo-zone{
    flex:0 0 auto;
    margin-top:80px;
    display:flex;flex-direction:column;align-items:center;
    gap:var(--tkn-spacing-md);
    z-index:20;
    position:relative;
  }
  .logo-mark{
    width:64px;height:64px;
    background:var(--tkn-color-warm-elevated);
    border-radius:var(--tkn-radius-md);
    box-shadow:var(--tkn-shadow-warm-card);
    display:flex;align-items:center;justify-content:center;
  }
  .logo-mark svg{width:40px;height:40px;}
  .logo-title{
    font-family:var(--tkn-font-display);
    font-size:var(--tkn-type-display-hero-size);
    font-weight:var(--tkn-type-display-hero-weight);
    letter-spacing:-0.02em;line-height:1.1;
    color:var(--tkn-color-warm-text-primary);
    margin-top:var(--tkn-spacing-sm);
  }
  .logo-slogan{
    font-family:var(--tkn-font-text);
    font-size:var(--tkn-type-body-size);
    color:var(--tkn-color-warm-text-secondary);
    letter-spacing:-0.024em;
    margin-top:var(--tkn-spacing-xs);
  }

  /* ── B3 WeChat CTA — IRON RULE 1 EXCEPTION ──────────────────── */
  .cta-zone{
    flex:1 1 auto;
    display:flex;flex-direction:column;justify-content:center;
    gap:var(--tkn-spacing-md);
    z-index:20;
    position:relative;
  }
  .wechat-cta{
    width:100%;height:52px;
    background:var(--tkn-color-brand-wechat);
    color:var(--tkn-color-white);
    border:none;border-radius:var(--tkn-radius-pill);
    font-family:var(--tkn-font-text);
    font-size:var(--tkn-type-body-size);
    font-weight:var(--tkn-type-body-emphasis-weight);
    letter-spacing:-0.024em;
    display:flex;align-items:center;justify-content:center;gap:var(--tkn-spacing-sm);
    transition:transform var(--tkn-motion-dur-fast) var(--tkn-motion-ease-standard);
    cursor:pointer;
    min-height:44px;
    box-shadow:0 4px 16px rgba(7,193,96,0.28);
  }
  .wechat-cta:active{transform:scale(0.97);}
  .wechat-cta:disabled,
  .wechat-cta[aria-disabled="true"]{
    opacity:0.4;cursor:not-allowed;
  }
  .wechat-cta:focus-visible{outline:none;box-shadow:var(--tkn-shadow-focus);}
  .wechat-cta .wxicon{width:22px;height:22px;flex:none;}

  /* ── B4 Other methods link ───────────────────────────────────── */
  .other-methods{
    text-align:center;
    margin-top:var(--tkn-spacing-12);
  }
  .other-methods a{
    color:var(--tkn-color-primary-link);
    font-family:var(--tkn-font-text);
    font-size:var(--tkn-type-link-size);
    font-weight:400;
    letter-spacing:-0.224px;
    text-decoration:none;
    line-height:1.43;
    padding:var(--tkn-spacing-sm) var(--tkn-spacing-md);
    display:inline-block;
    min-height:44px;
    min-width:44px;
  }
  .other-methods a:focus-visible{outline:none;box-shadow:var(--tkn-shadow-focus);border-radius:var(--tkn-radius-sm);}

  /* ── B5 Consent bar ──────────────────────────────────────────── */
  .consent-bar{
    flex:0 0 auto;
    display:flex;align-items:flex-start;gap:var(--tkn-spacing-sm);
    padding:var(--tkn-spacing-md) var(--tkn-spacing-xs);
    z-index:20;
    position:relative;
  }
  .consent-checkbox{
    width:20px;height:20px;flex:none;
    border:1.5px solid rgba(29,29,31,0.32);
    border-radius:var(--tkn-radius-sm);
    background:rgba(255,255,255,0.6);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    margin-top:2px;
    transition:background var(--tkn-motion-dur-fast) var(--tkn-motion-ease-standard);
    /* expand hit area to 44 */
    position:relative;
  }
  .consent-checkbox::after{
    content:"";position:absolute;inset:-12px;
  }
  .consent-checkbox[aria-checked="true"]{
    background:var(--tkn-color-primary-DEFAULT);
    border-color:var(--tkn-color-primary-DEFAULT);
  }
  .consent-checkbox svg{width:12px;height:12px;display:none;}
  .consent-checkbox[aria-checked="true"] svg{display:block;}
  .consent-checkbox:focus-visible{outline:none;box-shadow:var(--tkn-shadow-focus);}

  .consent-text{
    font-family:var(--tkn-font-text);
    font-size:var(--tkn-type-micro-size);
    color:var(--tkn-color-warm-text-secondary);
    line-height:1.5;
    letter-spacing:-0.12px;
  }
  .consent-text a{
    color:var(--tkn-color-primary-link);
    text-decoration:none;
    font-weight:500;
  }
  .consent-text a:focus-visible{outline:none;box-shadow:var(--tkn-shadow-focus);border-radius:2px;}

</style>
</head>
<body>

<div class="phone" data-mood="warm">
  <!-- B1 Status bar -->
  <header class="statusbar" data-testid="p00-statusbar" role="banner">
    <span class="time">9:41</span>
    <span class="icons">●●● ▮▮ 100%</span>
  </header>

  <!-- Page (single section · warm · gradient-aurora) -->
  <section class="page" data-mood="warm" data-section="login">
    <!-- B2 Logo zone -->
    <div class="logo-zone" data-testid="p00-logo-zone">
      <div class="logo-mark" data-testid="p00-logo-zone-logo" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <rect x="6" y="8" width="28" height="24" rx="5" stroke="#1d1d1f" stroke-width="2"/>
          <path d="M11 16 L18 16 M11 21 L25 21 M11 26 L21 26" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/>
          <circle cx="29" cy="11" r="3.2" fill="#7B5FFF"/>
        </svg>
      </div>
      <h1 class="logo-title" data-testid="p00-logo-zone-title">AI 错题本</h1>
      <p class="logo-slogan" data-testid="p00-logo-zone-slogan" aria-label="AI 错题本 · 让每一道错题都被看见">让每一道错题都被看见</p>
    </div>

    <!-- B3/B4 CTA zone -->
    <div class="cta-zone" data-testid="p00-cta-zone">
      <!-- B3 WeChat CTA · IRON RULE 1 EXCEPTION -->
      <button
        class="wechat-cta"
        data-testid="p00-wechat-cta-btn"
        data-iron-rule-1-exception="wechat-brand"
        aria-label="使用微信一键登录"
        aria-disabled="false">
        <svg class="wxicon" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
          <path d="M9 4C5.13 4 2 6.69 2 10c0 1.84.97 3.49 2.5 4.6L4 17l2.6-1.4C7.4 15.85 8.18 16 9 16c.5 0 .98-.05 1.45-.14C10.16 15.27 10 14.65 10 14c0-2.76 2.69-5 6-5 .35 0 .69.03 1.02.08C16.4 6.34 13.04 4 9 4zm-2 4.5a1 1 0 110 2 1 1 0 010-2zm4 0a1 1 0 110 2 1 1 0 010-2zM16 10c-3.31 0-6 2.24-6 5s2.69 5 6 5c.76 0 1.49-.13 2.16-.36L20 20.5l-.4-2.04C20.84 17.7 22 16.46 22 15c0-2.76-2.69-5-6-5zm-2 4a1 1 0 110 2 1 1 0 010-2zm4 0a1 1 0 110 2 1 1 0 010-2z"/>
        </svg>
        <span>微信一键登录</span>
      </button>

      <!-- B4 Other methods -->
      <div class="other-methods" data-testid="p00-other-methods">
        <a href="#phone" data-testid="p00-other-methods-link">其他登录方式</a>
      </div>
    </div>

    <!-- B5 Consent bar -->
    <div class="consent-bar" data-testid="p00-consent-bar">
      <button
        class="consent-checkbox"
        data-testid="p00-consent-bar-checkbox"
        role="checkbox"
        aria-checked="true"
        aria-label="同意用户协议和隐私政策">
        <svg viewBox="0 0 12 12" fill="none">
          <path d="M2 6 L5 9 L10 3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="consent-text" data-testid="p00-consent-bar-text">
        我已阅读并同意
        <a href="#tos" data-testid="p00-consent-bar-link-tos">《用户协议》</a>
        和
        <a href="#privacy" data-testid="p00-consent-bar-link-privacy">《隐私政策》</a>
      </p>
    </div>
  </section>
</div>

</body>
</html>
