<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="design-spec" content="P03-analyzing.spec.md@v1" />
<title>P03 · AI 分析中 · AI 错题本</title>
<style>
  /* ── Design tokens (mirrors design/system/tokens/*.json) ─────────────── */
  :root {
    /* L1 Apple base · color */
    --tkn-color-black:               #000000;
    --tkn-color-white:               #ffffff;
    --tkn-color-text-on-dark:        #ffffff;
    --tkn-color-primary-DEFAULT:     #0071e3;
    --tkn-color-primary-dark:        #2997ff;
    --tkn-color-surface-dark-1:      #272729;
    --tkn-color-surface-dark-3:      #28282a;
    --tkn-color-system-danger-DEFAULT: #C0392B;

    /* L1 typography */
    --tkn-font-display: 'SF Pro Display','PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif;
    --tkn-font-text:    'SF Pro Text','PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif;
    --tkn-font-mono:    'SF Mono','Menlo','Monaco','Consolas',monospace;
    --tkn-type-body-size:            17px;
    --tkn-type-body-emphasis-weight: 600;
    --tkn-type-caption-size:         14px;
    --tkn-type-caption-bold-weight:  600;
    --tkn-type-caption-tracking:     -0.224px;
    --tkn-type-micro-size:           12px;

    /* L1 spacing (4pt grid) */
    --tkn-spacing-xs:  4px;
    --tkn-spacing-sm:  8px;
    --tkn-spacing-12:  12px;
    --tkn-spacing-md:  16px;
    --tkn-spacing-lg:  24px;
    --tkn-spacing-xl:  32px;

    /* L1 radius */
    --tkn-radius-sm:   8px;
    --tkn-radius-md:   11px;
    --tkn-radius-lg:   12px;
    --tkn-radius-pill: 980px;
    --tkn-radius-circle: 50%;

    /* L1 shadow */
    --tkn-shadow-focus: 0 0 0 2px #0071e3;

    /* L1 motion */
    --tkn-motion-ease-standard: cubic-bezier(0.25,0.46,0.45,0.94);
    --tkn-motion-dur-fast:      150ms;
    --tkn-motion-dur-base:      250ms;

    /* L2 warmth · gradient (cool hero only) */
    --tkn-gradient-focus-night: linear-gradient(180deg, #0A0E1A 0%, #1A1F2E 100%);
    --tkn-color-warm-divider:   rgba(44,42,38,0.08);

    /* L3 celebration · mastery-mastered (used as step-done semantic color · molecule reuse) */
    --tkn-color-mastery-mastered: #34A853;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html,body{
    background:#e5e5ea;
    font-family:var(--tkn-font-text);
    color:var(--tkn-color-text-on-dark);
  }
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 0;}

  /* ── Phone shell 393×852 ─────────────────────────────────────────── */
  .phone{
    position:relative;width:393px;height:852px;
    background:var(--tkn-color-black);
    border-radius:54px;
    box-shadow:inset 0 0 0 6px #111, 0 30px 60px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .phone::before{
    content:"";position:absolute;left:50%;top:11px;
    transform:translateX(-50%);width:126px;height:37px;
    background:var(--tkn-color-black);border-radius:20px;z-index:50;
  }

  /* ── Status bar ────────────────────────────────────────────────── */
  .statusbar{
    position:absolute;top:0;left:0;right:0;height:54px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 var(--tkn-spacing-xl);
    font-family:var(--tkn-font-display);
    font-size:var(--tkn-type-body-size);
    font-weight:var(--tkn-type-body-emphasis-weight);
    z-index:40;color:var(--tkn-color-text-on-dark);
  }
  .statusbar .time{margin-top:12px;}
  .statusbar .icons{margin-top:12px;display:flex;gap:6px;align-items:center;font-size:13px;}

  /* ── Page (single section · cool · gradient-focus-night) ──────── */
  .page{
    position:absolute;inset:0;
    background:var(--tkn-gradient-focus-night);
    z-index:10;
    display:flex;flex-direction:column;
    padding:64px var(--tkn-spacing-md) var(--tkn-spacing-md);
  }

  /* ── B2 · Thumb card + model badge ──────────────────────────── */
  .p03-thumb-card{
    display:flex;align-items:center;gap:var(--tkn-spacing-12);
    background:var(--tkn-color-surface-dark-3);
    border-radius:var(--tkn-radius-md);
    padding:var(--tkn-spacing-12);
    margin-bottom:var(--tkn-spacing-lg);
  }
  .thumb-img{
    width:64px;height:64px;flex:none;
    border-radius:var(--tkn-radius-sm);
    background:linear-gradient(135deg, #1c2436 0%, #0a0d18 100%);
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,0.5);
    font-family:var(--tkn-font-mono);
    font-size:var(--tkn-type-micro-size);
    overflow:hidden;
  }
  .thumb-img svg{width:32px;height:32px;}
  .thumb-info{flex:1;min-width:0;}
  .thumb-title{
    font-family:var(--tkn-font-text);
    font-size:var(--tkn-type-caption-size);
    font-weight:var(--tkn-type-caption-bold-weight);
    color:var(--tkn-color-text-on-dark);
    letter-spacing:var(--tkn-type-caption-tracking);
    margin-bottom:var(--tkn-spacing-xs);
  }
  .model-badge{
    display:inline-flex;align-items:center;gap:var(--tkn-spacing-xs);
    background:var(--tkn-color-surface-dark-1);
    color:var(--tkn-color-primary-dark);
    border-radius:var(--tkn-radius-pill);
    padding:var(--tkn-spacing-xs) var(--tkn-spacing-sm);
    font-family:var(--tkn-font-mono);
    font-size:var(--tkn-type-micro-size);
  }
  .model-badge::before{
    content:"";width:6px;height:6px;border-radius:var(--tkn-radius-circle);
    background:var(--tkn-color-mastery-mastered);
  }

  /* ── B3 · AnalyzingPipeline 4 steps ────────────────────────── */
  .analyzing-pipeline{
    background:var(--tkn-color-surface-dark-3);
    border-radius:var(--tkn-radius-lg);
    padding:var(--tkn-spacing-md) var(--tkn-spacing-md) var(--tkn-spacing-12);
    margin-bottom:var(--tkn-spacing-md);
  }
  .pipeline-step{
    display:flex;align-items:center;gap:var(--tkn-spacing-12);
    padding:var(--tkn-spacing-sm) 0;
  }
  .pipeline-step + .pipeline-step{
    border-top:1px solid rgba(255,255,255,0.06);
  }
  .step-circle{
    width:28px;height:28px;
    border-radius:var(--tkn-radius-circle);
    display:flex;align-items:center;justify-content:center;
    flex:none;
    font-family:var(--tkn-font-text);
    font-size:var(--tkn-type-micro-size);
    font-weight:var(--tkn-type-caption-bold-weight);
  }
  .pipeline-step[data-status="done"] .step-circle{
    background:var(--tkn-color-mastery-mastered);
    color:var(--tkn-color-text-on-dark);
  }
  .pipeline-step[data-status="now"] .step-circle{
    background:var(--tkn-color-primary-dark);
    color:var(--tkn-color-text-on-dark);
    animation:sse-pulse 1500ms var(--tkn-motion-ease-standard) infinite;
  }
  .pipeline-step[data-status="wait"] .step-circle{
    background:transparent;
    border:1.5px solid rgba(255,255,255,0.32);
    color:rgba(255,255,255,0.4);
  }
  .step-label{
    flex:1;
    font-family:var(--tkn-font-text);
    font-size:var(--tkn-type-caption-size);
    color:var(--tkn-color-text-on-dark);
    letter-spacing:var(--tkn-type-caption-tracking);
  }
  .pipeline-step[data-status="wait"] .step-label{opacity:0.5;}
  .step-meta{
    font-family:var(--tkn-font-mono);
    font-size:var(--tkn-type-micro-size);
    color:rgba(255,255,255,0.5);
  }
  .pipeline-step[data-status="now"] .step-meta{
    color:var(--tkn-color-primary-dark);
  }
  .pipeline-step[data-status="done"] .step-meta{
    color:var(--tkn-color-mastery-mastered);
  }

  @keyframes sse-pulse{
    0%   {box-shadow:0 0 0 0 rgba(41,151,255,0.55);}
    70%  {box-shadow:0 0 0 8px rgba(41,151,255,0);}
    100% {box-shadow:0 0 0 0 rgba(41,151,255,0);}
  }

  /* ── B4 · JSON streaming area (monospace) ───────────────────── */
  .json-stream{
    flex:1 1 auto;
    background:rgba(0,0,0,0.4);
    border-radius:var(--tkn-radius-md);
    padding:var(--tkn-spacing-12);
    overflow:auto;
    font-family:var(--tkn-font-mono);
    font-size:var(--tkn-type-micro-size);
    color:rgba(255,255,255,0.78);
    line-height:1.5;
    margin-bottom:var(--tkn-spacing-md);
    letter-spacing:var(--tkn-type-caption-tracking);
    white-space:pre-wrap;
    word-break:break-all;
    max-height:200px;
  }
  .json-stream .key   {color:var(--tkn-color-primary-dark);}
  .json-stream .str   {color:var(--tkn-color-mastery-mastered);}
  .json-stream .punc  {color:rgba(255,255,255,0.5);}
  .stream-cursor{
    display:inline-block;width:8px;height:14px;
    background:var(--tkn-color-primary-dark);
    margin-left:2px;
    animation:sse-pulse 1000ms var(--tkn-motion-ease-standard) infinite;
    vertical-align:middle;
  }

  /* ── B5 · Cancel button (ghost grey pill) ───────────────────── */
  .cancel-btn{
    width:100%;height:48px;min-height:44px;
    background:var(--tkn-color-warm-divider);
    color:var(--tkn-color-text-on-dark);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:var(--tkn-radius-pill);
    font-family:var(--tkn-font-text);
    font-size:var(--tkn-type-body-size);
    font-weight:var(--tkn-type-body-emphasis-weight);
    cursor:pointer;
    transition:transform var(--tkn-motion-dur-fast) var(--tkn-motion-ease-standard);
  }
  .cancel-btn:active{transform:scale(0.97);}
  .cancel-btn:focus-visible{outline:none;box-shadow:var(--tkn-shadow-focus);}

  @media (prefers-reduced-motion: reduce){
    .pipeline-step[data-status="now"] .step-circle{animation:none;}
    .stream-cursor{animation:none;opacity:0.5;}
  }
</style>
</head>
<body>

<div class="phone" data-mood="cool">
  <!-- Status bar -->
  <header class="statusbar" data-testid="p03-statusbar" role="banner">
    <span class="time">9:41</span>
    <span class="icons">●●● ▮▮ 100%</span>
  </header>

  <!-- Page · single section · cool · gradient-focus-night -->
  <section class="page" data-mood="cool" data-section="analyzing">

    <!-- B2 · Thumb card + model badge -->
    <div class="p03-thumb-card" data-testid="p03-thumb-card">
      <div class="thumb-img" data-testid="p03-thumb-card-image" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3" y="5" width="18" height="14" rx="2" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
          <path d="M7 12 L11 12 M7 9 L15 9 M7 15 L13 15" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="thumb-info">
        <div class="thumb-title" data-testid="p03-thumb-card-title">数学 · 二次函数</div>
        <span class="model-badge" data-testid="analyzing-pipeline-model-badge" aria-label="当前 AI 模型">qwen-vl-max</span>
      </div>
    </div>

    <!-- B3 · AnalyzingPipeline · 4 step -->
    <main class="analyzing-pipeline" data-testid="analyzing-pipeline" role="main" aria-live="polite">
      <div class="pipeline-step" data-testid="analyzing-pipeline-step-1" data-status="done">
        <span class="step-circle" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 7 L6 11 L12 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="step-label">图像预处理</span>
        <span class="step-meta">240 ms</span>
      </div>
      <div class="pipeline-step" data-testid="analyzing-pipeline-step-2" data-status="now">
        <span class="step-circle" aria-hidden="true">2</span>
        <span class="step-label">OCR 题干</span>
        <span class="step-meta">进行中</span>
      </div>
      <div class="pipeline-step" data-testid="analyzing-pipeline-step-3" data-status="wait">
        <span class="step-circle" aria-hidden="true">3</span>
        <span class="step-label">错因诊断</span>
        <span class="step-meta">等待</span>
      </div>
      <div class="pipeline-step" data-testid="analyzing-pipeline-step-4" data-status="wait">
        <span class="step-circle" aria-hidden="true">4</span>
        <span class="step-label">生成解法</span>
        <span class="step-meta">等待</span>
      </div>
    </main>

    <!-- B4 · JSON streaming area -->
    <pre class="json-stream" data-testid="analyzing-pipeline-json-stream" aria-label="AI 流式输出"><span class="punc">{</span>
  <span class="key">"stem"</span><span class="punc">:</span> <span class="str">"已知函数 f(x)=x²-4x+3, 求方程 f(x)=0 的解"</span><span class="punc">,</span>
  <span class="key">"subject"</span><span class="punc">:</span> <span class="str">"math"</span><span class="punc">,</span>
  <span class="key">"kp"</span><span class="punc">:</span> <span class="punc">[</span><span class="str">"二次函数"</span><span class="punc">,</span> <span class="str">"求根公式"</span><span class="punc">]</span><span class="punc">,</span>
  <span class="key">"diff"</span><span class="punc">:</span> <span class="str">3</span><span class="punc">,</span>
  <span class="key">"steps"</span><span class="punc">:</span> <span class="punc">[</span>
    <span class="punc">{</span><span class="key">"i"</span><span class="punc">:</span><span class="str">1</span><span class="punc">,</span><span class="key">"t"</span><span class="punc">:</span><span class="str">"移项变形"</span><span class="punc">}</span><span class="punc">,</span>
    <span class="punc">{</span><span class="key">"i"</span><span class="punc">:</span><span class="str">2</span><span class="punc">,</span><span class="key">"t"</span><span class="punc">:</span><span class="str">"配方"</span><span class="punc">}</span><span class="punc">,</span>
    <span class="punc">{</span><span class="key">"i"</span><span class="punc">:</span><span class="str">3</span><span class="punc">,</span><span class="key">"t"</span><span class="punc">:</span><span class="str"<span class="stream-cursor"></span></pre>

    <!-- B5 · Cancel button -->
    <button class="cancel-btn" data-testid="analyzing-pipeline-cancel-btn" aria-label="取消分析" type="button">取消分析</button>

  </section>
</div>

</body>
</html>
