<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="design-spec" content="P10-calendar-month.spec.md@v2" />
<title>P10 · 日历月视图 · AI 错题本</title>
<style>
  /* ── Design tokens (mirrors design/system/tokens/*.json) ─────────────── */
  :root {
    /* L1 Apple base · color */
    --tkn-color-black:                       #000000;
    --tkn-color-white:                       #ffffff;
    --tkn-color-text-on-dark:                #ffffff;
    --tkn-color-primary-DEFAULT:             #0071e3;
    --tkn-color-primary-dark:                #2997ff;
    --tkn-color-system-danger-DEFAULT:       #C0392B;
    /* L1 typography */
    --tkn-font-display: 'SF Pro Display','PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif;
    --tkn-font-text:    'SF Pro Text','PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif;
    --tkn-type-display-hero-size:    56px;
    --tkn-type-display-hero-weight:  600;
    --tkn-type-sub-heading-size:     21px;
    --tkn-type-sub-heading-weight:   400;
    --tkn-type-body-size:            17px;
    --tkn-type-body-weight:          400;
    --tkn-type-caption-size:         14px;
    --tkn-type-caption-bold-weight:  600;
    --tkn-type-micro-size:           12px;
    /* L1 spacing (4pt grid) */
    --tkn-spacing-2:   4px;
    --tkn-spacing-xs:  4px;
    --tkn-spacing-sm:  8px;
    --tkn-spacing-12:  32px;
    --tkn-spacing-md:  16px;
    --tkn-spacing-lg:  24px;
    --tkn-spacing-xl:  32px;
    /* L1 radius */
    --tkn-radius-xs:    5px;
    --tkn-radius-sm:    8px;
    --tkn-radius-md:    11px;
    --tkn-radius-lg:    12px;
    --tkn-radius-pill:  980px;
    --tkn-radius-circle: 50%;
    /* L1 shadow */
    --tkn-shadow-focus: 0 0 0 2px #0071e3;
    /* L1 motion */
    --tkn-motion-duration-fast: 150ms;
    --tkn-motion-duration-base: 250ms;
    --tkn-motion-ease-standard: cubic-bezier(0.25,0.46,0.45,0.94);
    /* L2 warmth */
    --tkn-color-warm-bg:                #FAF8F4;
    --tkn-color-warm-elevated:          #FFFFFF;
    --tkn-color-warm-sunken:            #F2EDE3;
    --tkn-color-warm-text-primary:      #2C2A26;
    --tkn-color-warm-text-secondary:    rgba(44,42,38,0.72);
    --tkn-color-warm-divider:           rgba(44,42,38,0.08);
    --tkn-color-encouragement-DEFAULT:  #E8741C;
    --tkn-color-encouragement-soft:     rgba(232,116,28,0.10);
    --tkn-shadow-warm-card:             0 1px 2px rgba(44,42,38,0.04), 0 4px 12px rgba(44,42,38,0.06);
    /* EXCEPTION subject */
    --tkn-subject-math:       #C41E3A;
    --tkn-subject-physics:    #0057B7;
    --tkn-subject-chemistry:  #1A6B3A;
    --tkn-subject-english:    #9C4F00;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html,body{
    background:#e5e5ea;
    font-family:var(--tkn-font-text);
    color:var(--tkn-color-warm-text-primary);
  }
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 0;}

  /* ── Phone shell 393×852 ──────────────────────────────────────────── */
  .phone{
    position:relative;width:393px;height:852px;
    background:var(--tkn-color-black);
    border-radius:54px;
    box-shadow:inset 0 0 0 6px #111, 0 30px 60px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .phone::before{
    content:"";position:absolute;left:50%;top:11px;
    transform:translateX(-50%);width:126px;height:37px;
    background:var(--tkn-color-black);border-radius:20px;z-index:50;
  }

  /* ── Status bar ─────────────────────────────────────────────────── */
  .statusbar{
    position:absolute;top:0;left:0;right:0;height:54px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 var(--tkn-spacing-xl);
    font-family:var(--tkn-font-display);
    font-size:var(--tkn-type-body-size);font-weight:600;
    z-index:40;color:var(--tkn-color-warm-text-primary);
  }
  .statusbar .time{margin-top:12px;}
  .statusbar .icons{margin-top:12px;font-size:13px;display:flex;gap:6px;}

  /* ── Page (warm · single info section) ─────────────────────────── */
  .page{
    position:absolute;inset:0;
    background:var(--tkn-color-warm-bg);
    z-index:10;
    padding:54px 0 84px;
    overflow-y:auto;
    display:flex;flex-direction:column;
  }

  /* ── B1 Month nav ─────────────────────────────────────────────── */
  .month-nav{
    padding:var(--tkn-spacing-md) var(--tkn-spacing-lg);
    display:flex;align-items:center;justify-content:space-between;
    background:var(--tkn-color-warm-bg);
  }
  .month-nav-arrow{
    width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;cursor:pointer;
    color:var(--tkn-color-primary-DEFAULT);
    border-radius:var(--tkn-radius-pill);
    transition:background var(--tkn-motion-duration-fast) var(--tkn-motion-ease-standard);
  }
  .month-nav-arrow:active{transform:scale(0.97);}
  .month-nav-arrow:focus-visible{outline:none;box-shadow:var(--tkn-shadow-focus);}
  .month-nav-arrow svg{width:20px;height:20px;}
  .month-nav-title{
    font-family:var(--tkn-font-display);
    font-size:var(--tkn-type-sub-heading-size);
    font-weight:var(--tkn-type-caption-bold-weight);
    color:var(--tkn-color-warm-text-primary);
    letter-spacing:-0.024em;
    line-height:1.19;
  }
  .month-nav-today{
    margin-top:var(--tkn-spacing-2);
    text-align:center;
    font-size:var(--tkn-type-caption-size);
    color:var(--tkn-color-primary-DEFAULT);
    text-decoration:none;
    padding:var(--tkn-spacing-2) var(--tkn-spacing-sm);
    border-radius:var(--tkn-radius-pill);
    min-height:24px;
    display:inline-block;
  }
  .month-nav-center{display:flex;flex-direction:column;align-items:center;gap:0;}

  /* ── B2 Week header ───────────────────────────────────────────── */
  .week-header{
    display:grid;grid-template-columns:repeat(7,1fr);
    padding:var(--tkn-spacing-sm) var(--tkn-spacing-md);
    border-bottom:1px solid var(--tkn-color-warm-divider);
  }
  .week-header-cell{
    text-align:center;
    font-size:var(--tkn-type-caption-size);
    font-weight:var(--tkn-type-caption-bold-weight);
    color:var(--tkn-color-warm-text-secondary);
    letter-spacing:-0.224px;
    line-height:1.29;
  }
  .week-header-cell.weekend{
    color:var(--tkn-color-warm-text-primary);
  }

  /* ── B3 Month grid ───────────────────────────────────────────── */
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-template-rows:repeat(6,1fr);
    gap:var(--tkn-spacing-2);
    padding:var(--tkn-spacing-sm) var(--tkn-spacing-md);
    flex:1 1 auto;
    min-height:480px;
  }
  .month-cell{
    background:var(--tkn-color-warm-elevated);
    border-radius:var(--tkn-radius-md);
    padding:var(--tkn-spacing-2) var(--tkn-spacing-2) var(--tkn-spacing-xs);
    position:relative;
    cursor:pointer;
    border:1px solid var(--tkn-color-warm-divider);
    transition:transform var(--tkn-motion-duration-fast) var(--tkn-motion-ease-standard);
    min-height:44px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .month-cell:active{transform:scale(0.97);}
  .month-cell:focus-visible{outline:none;box-shadow:var(--tkn-shadow-focus);}
  .month-cell[data-out-of-month="true"]{
    opacity:0.4;
    background:var(--tkn-color-warm-bg);
  }
  .month-cell[data-today="true"]{
    border:2px solid var(--tkn-color-primary-DEFAULT);
    padding:3px 3px var(--tkn-spacing-2);
  }
  .month-cell-day{
    font-family:var(--tkn-font-text);
    font-size:13px;
    font-weight:600;
    color:var(--tkn-color-warm-text-primary);
    line-height:1.2;
    letter-spacing:-0.224px;
  }
  .month-cell[data-out-of-month="true"] .month-cell-day{
    color:var(--tkn-color-warm-text-secondary);
    font-weight:400;
  }
  .month-cell-dots{
    display:flex;flex-wrap:wrap;gap:2px;
    margin-top:auto;
    align-items:center;
    min-height:8px;
  }
  .dot{
    width:6px;height:6px;border-radius:var(--tkn-radius-circle);
    flex:none;
  }
  .dot-math      { background:var(--tkn-subject-math); }
  .dot-physics   { background:var(--tkn-subject-physics); }
  .dot-chemistry { background:var(--tkn-subject-chemistry); }
  .dot-english   { background:var(--tkn-subject-english); }
  .dot-exam      { background:var(--tkn-color-system-danger-DEFAULT); }
  .dot-family    { background:var(--tkn-color-encouragement-DEFAULT); }
  .month-cell-overflow{
    font-size:9px;
    font-weight:600;
    color:var(--tkn-color-warm-text-secondary);
    background:var(--tkn-color-warm-sunken);
    border-radius:var(--tkn-radius-pill);
    padding:0 4px;
    line-height:10px;
    height:10px;
    display:inline-flex;align-items:center;
  }

  /* ── B4 Legend bar ───────────────────────────────────────────── */
  .legend-bar{
    margin:var(--tkn-spacing-md);
    padding:var(--tkn-spacing-md);
    background:var(--tkn-color-warm-elevated);
    border-radius:var(--tkn-radius-lg);
    box-shadow:var(--tkn-shadow-warm-card);
    border:1px solid var(--tkn-color-warm-divider);
  }
  .legend-row{
    display:flex;flex-wrap:wrap;gap:var(--tkn-spacing-md);
    align-items:center;
  }
  .legend-item{
    display:inline-flex;align-items:center;gap:var(--tkn-spacing-2);
    font-size:var(--tkn-type-caption-size);
    color:var(--tkn-color-warm-text-secondary);
    letter-spacing:-0.224px;
    line-height:1.29;
  }
  .legend-item .dot{width:8px;height:8px;}

  /* ── Tab Bar ─────────────────────────────────────────────────── */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;
    height:84px;
    background:var(--tkn-color-warm-elevated);
    border-top:1px solid var(--tkn-color-warm-divider);
    display:grid;grid-template-columns:repeat(5,1fr);
    padding-bottom:24px;
    z-index:30;
  }
  .tabbar-item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:var(--tkn-spacing-2);
    cursor:pointer;border:none;background:transparent;
    color:var(--tkn-color-warm-text-secondary);
    font-size:10px;letter-spacing:-0.08px;
    min-height:44px;
  }
  .tabbar-item svg{width:24px;height:24px;fill:currentColor;}

</style>
</head>
