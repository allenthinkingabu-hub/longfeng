<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="design-spec" content="P-WELCOMEBACK.spec.md@v1" />
<title>P-WELCOMEBACK · 回流唤起 · AI 错题本</title>
<style>
  /* ── Design tokens (mirrors design/system/tokens/*.json) ─────────────── */
  :root {
    /* L1 · color */
    --tkn-color-primary-DEFAULT:   #0071e3;
    --tkn-color-primary-link:      #0066cc;
    --tkn-color-text-on-dark:      #ffffff;
    --tkn-color-system-info-DEFAULT: #005C99;
    /* L1 · typography */
    --tkn-font-display: 'SF Pro Display','PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif;
    --tkn-font-text:    'SF Pro Text','PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif;
    --tkn-type-display-hero-size: 56px;
    --tkn-type-display-hero-lh: 1.07;
    --tkn-type-display-hero-ls: -0.28px;
    --tkn-type-display-hero-weight: 600;
    --tkn-type-sub-heading-size: 22px;
    --tkn-type-sub-heading-lh: 1.27;
    --tkn-type-sub-heading-ls: -0.224px;
    --tkn-type-sub-heading-weight: 600;
    --tkn-type-body-size: 17px;
    --tkn-type-body-lh: 1.47;
    --tkn-type-body-ls: -0.374px;
    --tkn-type-body-weight: 400;
    --tkn-type-caption-size: 12px;
    --tkn-type-caption-lh: 1.33;
    --tkn-type-caption-ls: 0.06px;
    --tkn-type-caption-weight: 400;
    /* L1 · spacing */
    --tkn-spacing-2:   2px;
    --tkn-spacing-xs:  4px;
    --tkn-spacing-sm:  8px;
    --tkn-spacing-12:  12px;
    --tkn-spacing-md:  16px;
    --tkn-spacing-lg:  24px;
    --tkn-spacing-xl:  32px;
    --tkn-spacing-2xl: 48px;
    /* L1 · radius */
    --tkn-radius-sm:   8px;
    --tkn-radius-md:   11px;
    --tkn-radius-lg:   12px;
    --tkn-radius-pill: 980px;
    --tkn-radius-circle: 50%;
    /* L1 · shadow */
    --tkn-shadow-card: 0 24px 64px rgba(0,0,0,0.22);
    /* L1 · motion */
    --tkn-motion-ease-standard: cubic-bezier(0.25,0.46,0.45,0.94);
    --tkn-motion-dur-base: 250ms;

    /* L2 · warmth */
    --tkn-color-warm-bg:             #FAF8F4;
    --tkn-color-warm-elevated:       #FFFFFF;
    --tkn-color-warm-text-primary:   #2C2A26;
    --tkn-color-warm-text-secondary: rgba(44,42,38,0.72);
    --tkn-color-warm-divider:        rgba(44,42,38,0.08);
    --tkn-color-aurora-particle:     rgba(255,255,255,0.18);
    --tkn-color-aurora-blur:         rgba(255,255,255,0.06);
    --tkn-gradient-aurora:           linear-gradient(135deg,#4F6FFF 0%,#7B5FFF 50%,#B85FFF 100%);
    --tkn-shadow-warm-card:          0 1px 2px rgba(44,42,38,0.04), 0 4px 12px rgba(44,42,38,0.06);
    --tkn-shadow-warm-hero:          0 8px 24px rgba(31,58,147,0.20);

    /* L3 · celebration */
    --tkn-motion-celebrate-streak-bump: 400ms;
    --tkn-ease-celebrate-bounce-out:    cubic-bezier(0.34,1.56,0.64,1);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html,body{
    background: rgba(0,0,0,0.10);
    font-family: var(--tkn-font-text);
    color: var(--tkn-color-warm-text-primary);
  }
  body{
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: var(--tkn-spacing-xl) 0;
  }

  /* ── Phone shell ────────────────────────────────────────────────────── */
  .phone{
    position: relative; width: 393px; height: 852px;
    background: var(--tkn-color-warm-bg);
    border-radius: var(--tkn-spacing-2xl);
    box-shadow: inset 0 0 0 6px #111, var(--tkn-shadow-card);
    overflow: hidden;
  }
  .phone::before{
    content: ""; position: absolute; left: 50%; top: 11px;
    transform: translateX(-50%); width: 126px; height: 37px;
    background: #000; border-radius: 20px; z-index: 50;
  }

  /* ── Status bar ─────────────────────────────────────────────────────── */
  .statusbar{
    position: absolute; top: 0; left: 0; right: 0; height: 54px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--tkn-spacing-xl);
    font-size: 17px; font-weight: 600; z-index: 40;
    color: var(--tkn-color-text-on-dark);
  }
  .statusbar .time{ margin-top: 12px; font-family: var(--tkn-font-display); }
  .statusbar .icons{ margin-top: 12px; display: flex; gap: var(--tkn-spacing-sm); align-items: center; }

  /* ── Hero · Aurora gradient ──────────────────────────────────────────── */
  .hero{
    position: absolute; top: 0; left: 0; right: 0; height: 460px;
    background: var(--tkn-gradient-aurora);
    overflow: hidden; z-index: 10;
    box-shadow: var(--tkn-shadow-warm-hero);
  }
  .hero-blur-1{
    position: absolute; width: 280px; height: 280px;
    border-radius: var(--tkn-radius-circle);
    top: -90px; left: -100px;
    background: var(--tkn-color-aurora-blur);
    filter: blur(40px);
  }
  .hero-blur-2{
    position: absolute; width: 220px; height: 220px;
    border-radius: var(--tkn-radius-circle);
    bottom: -80px; right: -60px;
    background: var(--tkn-color-aurora-blur);
    filter: blur(36px);
  }
  .hero-particle{
    position: absolute;
    background: var(--tkn-color-aurora-particle);
    border-radius: var(--tkn-radius-circle);
  }
  .hero-particle.p1{ width:6px; height:6px; top:130px; left:60px; }
  .hero-particle.p2{ width:4px; height:4px; top:180px; right:70px; }
  .hero-particle.p3{ width:8px; height:8px; top:240px; left:30%; }
  .hero-particle.p4{ width:5px; height:5px; top:300px; right:24%; }

  /* ── Welcomeback hero content ───────────────────────────────────────── */
  .hero-safe{
    position: absolute; top: 70px; left: var(--tkn-spacing-md); right: var(--tkn-spacing-md);
    z-index: 20; color: var(--tkn-color-text-on-dark);
  }
  .hero-row{ display: flex; align-items: center; gap: var(--tkn-spacing-12); }
  .hero-avatar{
    width: 48px; height: 48px;
    border-radius: var(--tkn-radius-circle);
    background: var(--tkn-color-aurora-blur);
    border: 1.5px solid var(--tkn-color-aurora-particle);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--tkn-font-display);
    font-weight: 600;
    font-size: 18px;
    color: var(--tkn-color-text-on-dark);
    letter-spacing: 0.5px;
  }
  .hero-greeting{ flex: 1; }
  .hero-eyebrow{
    font-size: 11px; font-weight: 600;
    letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--tkn-color-aurora-particle);
    font-family: var(--tkn-font-text);
  }
  .hero-name{
    margin-top: var(--tkn-spacing-xs);
    font-size: var(--tkn-type-sub-heading-size);
    font-weight: var(--tkn-type-sub-heading-weight);
    line-height: var(--tkn-type-sub-heading-lh);
    letter-spacing: var(--tkn-type-sub-heading-ls);
    font-family: var(--tkn-font-display);
    color: var(--tkn-color-text-on-dark);
  }
  .hero-caption{
    margin-top: var(--tkn-spacing-sm);
    font-size: var(--tkn-type-caption-size);
    line-height: var(--tkn-type-caption-lh);
    letter-spacing: var(--tkn-type-caption-ls);
    color: var(--tkn-color-aurora-particle);
    font-family: var(--tkn-font-text);
  }

  /* ── Pending pulse · the streak-bump number ─────────────────────────── */
  .pending-pulse{
    margin-top: var(--tkn-spacing-lg);
    display: flex; flex-direction: column; align-items: center;
    color: var(--tkn-color-text-on-dark);
  }
  .pending-pulse-number{
    font-family: var(--tkn-font-display);
    font-size: var(--tkn-type-display-hero-size);
    font-weight: var(--tkn-type-display-hero-weight);
    line-height: var(--tkn-type-display-hero-lh);
    letter-spacing: var(--tkn-type-display-hero-ls);
    color: var(--tkn-color-text-on-dark);
    animation: streak-bump var(--tkn-motion-celebrate-streak-bump) var(--tkn-ease-celebrate-bounce-out) 1;
    transform-origin: center;
  }
  .pending-pulse-label{
    margin-top: var(--tkn-spacing-xs);
    font-size: var(--tkn-type-body-size);
    line-height: var(--tkn-type-body-lh);
    letter-spacing: var(--tkn-type-body-ls);
    font-weight: 500;
    color: var(--tkn-color-aurora-particle);
    font-family: var(--tkn-font-text);
  }
  .pending-pulse-sub{
    margin-top: var(--tkn-spacing-12);
    padding: var(--tkn-spacing-xs) var(--tkn-spacing-12);
    border-radius: var(--tkn-radius-pill);
    background: var(--tkn-color-aurora-blur);
    border: 1px solid var(--tkn-color-aurora-particle);
    font-size: var(--tkn-type-caption-size);
    color: var(--tkn-color-text-on-dark);
    font-family: var(--tkn-font-text);
  }

  /* ── Memory curve preview (灰色未来态) ──────────────────────────────── */
  .memory-curve{
    position: absolute; left: var(--tkn-spacing-md); right: var(--tkn-spacing-md);
    bottom: var(--tkn-spacing-md);
    height: 60px;
    z-index: 20;
  }
  .memory-curve svg{ width: 100%; height: 100%; overflow: visible; }
  .memory-curve text{
    font-family: var(--tkn-font-text);
    font-size: 9px;
    font-weight: 600;
    fill: var(--tkn-color-aurora-particle);
    letter-spacing: 0.04px;
  }
  .memory-curve-caption{
    position: absolute; bottom: -16px; left: 0; right: 0;
    text-align: center;
    font-size: var(--tkn-type-caption-size);
    color: var(--tkn-color-aurora-particle);
    font-family: var(--tkn-font-text);
  }

  /* ── Scroll info area (mood=warm) ───────────────────────────────────── */
  .scroll{
    position: absolute; top: 460px; left: 0; right: 0; bottom: 0;
    overflow: auto;
    padding: var(--tkn-spacing-lg) var(--tkn-spacing-md) var(--tkn-spacing-xl);
    background: var(--tkn-color-warm-bg);
    border-top-left-radius: var(--tkn-spacing-lg);
    border-top-right-radius: var(--tkn-spacing-lg);
    margin-top: -16px;
    z-index: 25;
  }

  /* ── Account summary card ───────────────────────────────────────────── */
  .account-summary{
    background: var(--tkn-color-warm-elevated);
    border-radius: var(--tkn-radius-lg);
    box-shadow: var(--tkn-shadow-warm-card);
    padding: var(--tkn-spacing-md);
  }
  .account-summary-row{
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--tkn-spacing-sm) 0;
  }
  .account-summary-row + .account-summary-row{
    border-top: 1px solid var(--tkn-color-warm-divider);
  }
  .account-summary-label{
    font-size: var(--tkn-type-caption-size);
    color: var(--tkn-color-warm-text-secondary);
    font-family: var(--tkn-font-text);
  }
  .account-summary-value{
    font-size: var(--tkn-type-body-size);
    font-weight: 600;
    color: var(--tkn-color-warm-text-primary);
    font-family: var(--tkn-font-display);
    letter-spacing: var(--tkn-type-body-ls);
  }

  /* ── CTA block ──────────────────────────────────────────────────────── */
  .cta-block{
    margin-top: var(--tkn-spacing-md);
    display: flex; flex-direction: column; gap: var(--tkn-spacing-sm);
  }
  .oauth-cta{
    width: 100%;
    height: 52px;
    border: none;
    border-radius: var(--tkn-radius-pill);
    background: var(--tkn-color-primary-DEFAULT);
    color: var(--tkn-color-text-on-dark);
    font-family: var(--tkn-font-text);
    font-size: var(--tkn-type-body-size);
    font-weight: 600;
    letter-spacing: var(--tkn-type-body-ls);
    cursor: pointer;
    transition: transform var(--tkn-motion-dur-base) var(--tkn-motion-ease-standard);
    min-height: 44px;
  }
  .oauth-cta:active{ transform: scale(0.97); }

  .switch-account{
    width: 100%;
    height: 44px;
    background: transparent;
    color: var(--tkn-color-warm-text-secondary);
    font-family: var(--tkn-font-text);
    font-size: var(--tkn-type-caption-size);
    font-weight: 500;
    text-align: center;
    text-decoration: none;
    border: none;
    cursor: pointer;
    line-height: 44px;
    min-height: 44px;
  }
  .switch-account:hover,
  .switch-account:focus{
    color: var(--tkn-color-primary-link);
    text-decoration: underline;
  }

  /* ── Auto exit timer caption ────────────────────────────────────────── */
  .auto-exit{
    margin-top: var(--tkn-spacing-md);
    text-align: center;
    font-size: var(--tkn-type-caption-size);
    color: var(--tkn-color-warm-text-secondary);
    font-family: var(--tkn-font-text);
  }
  .auto-exit-icon{
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: var(--tkn-radius-circle);
    background: var(--tkn-color-warm-text-secondary);
    margin-right: var(--tkn-spacing-xs);
    vertical-align: middle;
    opacity: 0.5;
  }

  /* ── Whitelist keyframes only ───────────────────────────────────────── */
  @keyframes streak-bump {
    0%   { transform: scale(0.85); opacity: 0; }
    60%  { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pending-pulse-number{ animation: none; }
  }
</style>
</head>
<body>
  <div class="phone" data-mood="celebrate">
    <!-- ── Status bar ── -->
    <div class="statusbar" data-testid="welcomeback-statusbar" data-mood="celebrate">
      <div class="time">9:41</div>
      <div class="icons" aria-hidden="true">
        <span style="font-size:13px;">●●●</span>
        <span style="font-size:13px;">📶</span>
        <span style="font-size:13px;">🔋</span>
      </div>
    </div>

    <!-- ── Hero · mood=celebrate ── -->
    <header
      class="hero"
      role="banner"
      data-testid="welcomeback-hero"
      data-mood="celebrate"
      aria-labelledby="welcomeback-hero-name"
    >
      <div class="hero-blur-1" aria-hidden="true"></div>
      <div class="hero-blur-2" aria-hidden="true"></div>
      <span class="hero-particle p1" aria-hidden="true"></span>
      <span class="hero-particle p2" aria-hidden="true"></span>
      <span class="hero-particle p3" aria-hidden="true"></span>
      <span class="hero-particle p4" aria-hidden="true"></span>

      <div class="hero-safe">
        <div class="hero-row">
          <div
            class="hero-avatar"
            data-testid="welcomeback-hero-avatar"
            aria-hidden="true"
          >Z</div>
          <div class="hero-greeting">
            <div class="hero-eyebrow" data-testid="welcomeback-hero-eyebrow">WELCOME BACK</div>
            <h1
              class="hero-name"
              id="welcomeback-hero-name"
              data-testid="welcomeback-hero-name"
            >欢迎回来，张*</h1>
            <div class="hero-caption" data-testid="welcomeback-hero-caption">
              你离开 12 天了，TA 们还在等你
            </div>
          </div>
        </div>

        <!-- ── Pending pulse · streak-bump animation on number ── -->
        <div
          class="pending-pulse"
          data-testid="welcomeback-pending-pulse"
          role="status"
          aria-live="polite"
          aria-label="还剩 14 个待复习"
        >
          <div
            class="pending-pulse-number"
            data-testid="welcomeback-pending-pulse-number"
          >14</div>
          <div
            class="pending-pulse-label"
            data-testid="welcomeback-pending-pulse-label"
          >还剩 个待复习</div>
          <div
            class="pending-pulse-sub"
            data-testid="welcomeback-pending-pulse-sub"
          >距上次登录 12 天</div>
        </div>
      </div>

      <!-- ── Memory curve preview (variant=preview · 全部灰色未来态) ── -->
      <figure
        class="memory-curve"
        data-testid="memory-curve"
        role="img"
        aria-label="艾宾浩斯遗忘曲线 · T1-T6 等你回来继续推进"
      >
        <svg viewBox="0 0 360 60" data-testid="memory-curve-svg" aria-hidden="true">
          <path
            d="M 10 50 Q 70 20 130 35 T 250 30 T 350 28"
            fill="none"
            stroke="rgba(255,255,255,0.40)"
            stroke-width="2"
            stroke-dasharray="4 4"
          />
          <circle data-testid="memory-curve-node-T1" cx="20"  cy="48" r="5" fill="rgba(255,255,255,0.30)" data-status="future"/>
          <circle data-testid="memory-curve-node-T2" cx="80"  cy="33" r="5" fill="rgba(255,255,255,0.30)" data-status="future"/>
          <circle data-testid="memory-curve-node-T3" cx="140" cy="34" r="5" fill="rgba(255,255,255,0.30)" data-status="future"/>
          <circle data-testid="memory-curve-node-T4" cx="200" cy="32" r="5" fill="rgba(255,255,255,0.30)" data-status="future"/>
          <circle data-testid="memory-curve-node-T5" cx="270" cy="30" r="5" fill="rgba(255,255,255,0.30)" data-status="future"/>
          <circle data-testid="memory-curve-node-T6" cx="340" cy="28" r="5" fill="rgba(255,255,255,0.30)" data-status="future"/>
          <text x="20"  y="62" text-anchor="middle">T1</text>
          <text x="80"  y="62" text-anchor="middle">T2</text>
          <text x="140" y="62" text-anchor="middle">T3</text>
          <text x="200" y="62" text-anchor="middle">T4</text>
          <text x="270" y="62" text-anchor="middle">T5</text>
          <text x="340" y="62" text-anchor="middle">T6</text>
        </svg>
      </figure>
    </header>

    <!-- ── Scroll info area · mood=warm ── -->
    <main
      class="scroll"
      role="main"
      data-mood="warm"
    >
      <!-- B5 · Account summary card -->
      <section
        class="account-summary"
        data-testid="welcomeback-account-summary"
        data-mood="warm"
        aria-label="账号摘要"
      >
        <div class="account-summary-row">
          <span class="account-summary-label">累计入库</span>
          <span
            class="account-summary-value"
            data-testid="welcomeback-account-summary-total"
          >82 题</span>
        </div>
        <div class="account-summary-row">
          <span class="account-summary-label">上次登录</span>
          <span
            class="account-summary-value"
            data-testid="welcomeback-account-summary-last-login"
          >12 天前</span>
        </div>
        <div class="account-summary-row">
          <span class="account-summary-label">还剩待复习</span>
          <span
            class="account-summary-value"
            data-testid="welcomeback-account-summary-pending"
          >14 题</span>
        </div>
      </section>

      <!-- B6 · Primary OAuth CTA + B7 · Switch account link -->
      <div class="cta-block" data-mood="warm">
        <button
          type="button"
          class="oauth-cta"
          data-testid="welcomeback-oauth-cta"
          aria-label="一键回登 · 通过微信或 Apple 刷新登录态"
        >一键回登</button>
        <a
          href="/landing"
          class="switch-account"
          role="button"
          data-testid="welcomeback-switch-account"
          aria-label="看看新功能 · 跳转访客落地页"
        >看看新功能</a>
      </div>

      <!-- B8 · Auto exit timer -->
      <div
        class="auto-exit"
        data-testid="welcomeback-auto-exit"
        data-mood="warm"
        role="status"
        aria-live="polite"
      >
        <span class="auto-exit-icon" aria-hidden="true"></span>
        60 秒不操作将自动退出此页
      </div>
    </main>
  </div>
</body>
</html>
