        交互锚点：mockup 08 底部 ractions div · 3 个 rbtn · ri 图标 + rl 主标 + rs 副标
      observable_behavior_anchor: ""
    risks:
      - "401（token 过期）应触发全局登出 + 暂存当前 quality 待重登后重试 · 依赖 s7 全局拦截器"
      - "409 自动重试一次后仍失败 · 用户体验差 · 需 lock-note 文案 + Sentry 标记 critical"
