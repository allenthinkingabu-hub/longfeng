  # ============ SC-14 · 家长监督视图（s8 主 · 2 AC · 邀请码兑换占位）============
  - ac_id: "SC-14.AC-1"
    title: "P-OBSERVER · 家长只读视图 · scope=READ JWT + 学生概要 + 错题统计 + 7 天记录 + 禁用操作（mockup 18）"
    statement: |
      家长输入邀请码兑换 → A-2 颁发 scope=READ JWT → 路由 /observer/{studentId}（受 JWT scope 守门 · 非 READ scope 直接 403）→ 渲染：
      顶部 watermark 'scope = READ · observer only'（z-index 8 · 半透明）+ 退出按钮 + 品牌 chip '观察者 · Observer' ·
      身份卡：Parent 头像 + '您是 X 的家长' + scope=READ badge + 会话剩余 chip + 邀请码 chip + '学生可撤销 · 秒级生效'·
      学生概要：学生头像 + 姓名 + 年级班级 + 连续打卡 + 本周题数 ·
      统计 stats：错题总数 + 掌握率 + 待复习 ·
      近 7 天复习记录列表（学科 chip + 节点 chip + 完成时间 / 预计时间 + 进度条）· 数据来源 GET /review-stats?range=week + GET /wrongbook/items?ownerId={studentId} ·
      禁用操作区：编辑/重做/归档/分享 4 按钮 grayed out（disabled state · pointer-events: none）+ lock-note 文案 ·
      会话剩余 ≤ 5min 时弹 toast 提示 · 0min 时强制跳出登录页（清除 JWT）。
    source: "mockup 18_observer.html · Q2 决策修正（邀请码而非短链）· 落地计划 §12.0.5 SC-14.AC-1 修正"
    critical: true
    critical_reason: "权限 + 合规 + 未成年人数据跨账号查看 · scope=READ JWT 颁发与守门是法律边界 · 任何写接口未在网关层拦下都构成数据泄露事件"
    domain_entities: [ObserverSessionVO, ScopeReadJwt, StudentSummaryVO, WatermarkOverlay]
    user_journey: "已兑换 JWT → 跳 P-OBSERVER → 渲染观察者视图 → 用户浏览只读数据 → 倒计时到时强制退出"
    upstream_contract:
      - { from_phase: s5, api: "GET /review-stats?range=week + ownerId={studentId} · header Authorization: Bearer <scope=READ JWT> · s5 当前接口需扩 ownerId 参数（路径 B 解冻范围内或新增 ADR 0018）" }
      - { from_phase: s3, api: "GET /wrongbook/items?ownerId={studentId} · 同上 ownerId 参数 · s3 已 done 但需扩参数支持（独立 ADR · 不在 s5-v2 范围）" }
      - { from_phase: gateway, api: "网关 JWT scope 解析 + 写接口 403 拦截 · 已属网关基础设施 · s8 不实现" }
    downstream_contract: []
    four_role_slots:
      architect_anchor: "design/arch/s8-review-insight.md ## AC: SC-14.AC-1 · §1 ObserverSessionVO classDiagram · §3 GET /review-stats + /wrongbook/items 加 ownerId 参数 · §4 NFR 会话过期处理"
      dev_anchor: ""
      qa_anchor: ""
      ux_anchor: |
        Sd mockup design/mockups/wrongbook/18_observer.html · baseline/P-OBSERVER.png ·
        testid: observer.root / observer.watermark-read /
        observer.identity-card / observer.identity-role / observer.identity-scope-badge / observer.identity-session-remain / observer.identity-invite-code / observer.identity-revocable /
        observer.exit-btn /
        observer.student-summary / observer.student-name / observer.student-grade /
        observer.stats-total / observer.stats-mastery / observer.stats-pending /
        observer.review-list / observer.review-item / observer.review-item-progress-bar /
        observer.disabled-actions / observer.disabled-btn-edit / observer.disabled-btn-redo / observer.disabled-btn-archive / observer.disabled-btn-share / observer.lock-note /
        observer.session-expiring-toast / observer.session-expired-modal
      observable_behavior_anchor: ""
    risks:
      - "ownerId 参数扩展：s5 GET /review-stats 与 s3 GET /wrongbook/items 当前未支持 ownerId · 需 ADR 0018（独立于 s5-v2）· 否则家长视图取不到数据 · critical 阻塞"
      - "网关层 scope=READ JWT 写接口 403 拦截属基础设施 · 必须 s5.5/s9 验证链路 · 测试用 Playwright 模拟写请求验证 403"
      - "watermark 'READ' 必须 z-index 高于内容但低于 toast/modal · 不可被 CSS 覆盖隐藏（防绕过）"
      - "禁用按钮 disabled + pointer-events:none + ARIA aria-disabled=true 三重防御"
    verification_matrix:
      happy_path:
        - id: "happy_path.0"
          given: "家长持 scope=READ JWT 进 /observer/{studentId}"
          when: "渲染"
          then: "全区块显 · watermark 在 · 4 按钮 disabled · 退出按钮可点"
      error_paths:
        - id: "error_paths.0"
          given: "家长持 scope=READ JWT 尝试调写接口（如 POST /wrongbook/items）"
          when: "网关层拦截"
          then: "返回 403 + error_code=SCOPE_INSUFFICIENT · 前端 toast '观察者无写权限'"
        - id: "error_paths.1"
          given: "学生在另一端点'撤销'按钮点击"
          when: "家长端下次 fetch"
