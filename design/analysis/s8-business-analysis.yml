          when: "倒计时"
          then: "顶部 toast 'observer.session-expiring-toast'·学生概要不影响"
        - id: "boundary.1"
          given: "会话剩余 0min"
          when: "倒计时归零"
          then: "强制跳登录页 · 清 JWT · modal 'observer.session-expired-modal' · CTA '重新输入邀请码'"
      observable: []
      visual:
        - id: "visual.0"
          given: "Playwright 截图 P-OBSERVER · 学生 Allen · 86 错题 · 73% 掌握率"
          when: "vs baseline/P-OBSERVER.png"
          then: "pixel diff ≤ 3% · watermark / identity-card / 学生概要 / stats / 7 天记录 / 禁用按钮全区块对齐"

