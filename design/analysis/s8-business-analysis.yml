    critical_reason: "并发 + 评分写入正确性 · 涉未成年人复习状态记录 · 乐观锁 409 / mastered 410 边界处理直接影响后续节点调度 · 前端错处理决定数据一致性"
    domain_entities: [ReviewOutcomeVO, QualityVote, MutationState]
    user_journey: "用户点 rating 按钮 → loading → POST complete → 200/Server 副作用（s5 写 outcome + 重算 next_review_at）→ 前端 invalidate today query → 跳 done 页"
    upstream_contract:
      - { from_phase: s5, api: "POST /review-plans/{id}/complete body {quality: 0|3|5} · 200 返回 {planId, nextReviewAt, easeFactorAfter, masteredCount} · 4xx/410/409 错误见 s5-business-analysis SC-08.AC-1" }
    downstream_contract: []
    four_role_slots:
      architect_anchor: "design/arch/s8-review-insight.md ## AC: SC-08.AC-3 · §3 mutation 状态机 + 错误恢复策略 · §4 NFR P95 ≤ 150ms round-trip"
