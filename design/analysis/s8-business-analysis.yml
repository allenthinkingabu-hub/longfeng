# 6. 业务说理（narrative · 200-500 字 · 散文 · 答"做什么 + 为什么"）
# ============================================================

narrative: |
  S8 是 AI 错题本"用户留下来的理由" —— 艾宾浩斯复习闭环的前端用户侧。在 s5（review-plan-service T0-T6 引擎）+ s7（错题主循环前端骨架）
  之上，落地 4 张 Sd 高保真 mockup（07 今日复习 / 08 全屏答题 / 09 完成总结 / 18 家长视图）的双端实现（H5 React+Konsta · 微信原生+Vant
  Weapp）· 范围严格收口 3 SC（按 mapping 权威修正主文档 §12.0.5 漂移）。

  【SC-08 复习答题打分】4 AC 闭环：① 用户进入 P-REVIEW-TODAY 拉 GET /review-plans?date=today 拿当日 due 节点（按时间分组 · 现在/上午/下午）；
  ② 点卡片进 P-REVIEW-EXEC 全屏作答 → 工作区手写/键盘/公式三工具 → 点"揭示答案"显示 AI 标准解答 + 分步骤；③ 底部 3 档自评（未掌握/部分/已掌握 →
  SM-2 quality 0/3/5）触发 POST /review-plans/{id}/complete 同事务返回 nextReviewAt + easeFactorAfter；④ 跳 P-REVIEW-DONE 庆祝页 ·
  显示节点推进（T2→T3）+ 今日战绩 + 知识点掌握变化 + 下次复习时间卡（"添加日历"按钮调用日历 API）。

  【SC-09 学情卡片】3 AC + 路径 B 解冻 s5：顶部周/月/季 tab 切换 → 一次 GET /review-stats?range=X 拿数据 → 4 图并列：① 30 日复习频次柱
  状图（s5 已有 data[].reviewCount 支持）② 一周正确率趋势线 + Top3 弱项卡片（s5 已有 data[].correctRate + topWeak[]）③ 学科分布柱状图
  （依赖 s5-v2 扩展 subjectBreakdown[] 字段 · 阻塞 fe-builder）④ 艾宾浩斯曲线 overlay 折线图（依赖 s5-v2 扩展 ebbinghaus[] · 阻塞
  fe-builder）。Lighthouse Performance ≥ 85（比 s7 提 5 分）· 4 图懒加载 + 骨架屏。

  【SC-14 家长监督视图】2 AC：① 家长拿邀请码 O-XXXX-XXX 在 H5 / 小程序"我的"页输入兑换 → 后端颁发 scope=READ JWT（s8 阶段调用 stub ·
  s11 接管真实链路）→ 跳 P-OBSERVER 只读视图；② P-OBSERVER 完整呈现学生身份卡 / 会话剩余 / 错题统计 / 7 天复习记录 / 禁用操作区
  （编辑/重做/归档/分享四按钮 grayed out + lock-note 文案"JWT scope=READ 网关层 403 拒"）· 学生可在"我的→观察者→撤销"秒级失效。

  本 Phase 不负责：SM-2 算法（s5）· 后端学情聚合扩展（s5-v2 子 Phase · 阻塞 SC-09.AC-2/AC-3 fe-builder）· 短链 / 邀请码生成 / scope=READ
  JWT 真实颁发（s11）· P-WELCOMEBACK 设备指纹回归（s11 SC-12/13）· E2E 全量（s9）。

