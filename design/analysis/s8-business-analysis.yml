  - ac_id: "SC-08.AC-3"
    title: "3 档自评 + POST /review-plans/{id}/complete + 乐观锁 409 处理 + invalidate cache（mockup 08 底部 rating-bar）"
    statement: |
      P-REVIEW-EXEC 底部 rating-bar 三按钮：未掌握 forgot（quality=0 · 副标"回到 T0"）/ 部分 partial（quality=3 · 副标"原计划不变"）/
      已掌握 master（quality=5 · 副标"加速到下一节点"）· 用户点击任一按钮 → useMutation 调 POST /review-plans/{id}/complete body {quality} ·
      成功 → invalidate ['review-plans', 'today'] query → 跳 P-REVIEW-DONE 或连串模式下一题 · 失败 → 错误处理：
      400 INVALID_QUALITY → Sentry 上报 · 视为前端 bug（不应发生 · quality 来自常量 0/3/5）·
      404 → 此题已删 · Toast + 跳回 today ·
      409 乐观锁冲突 → 自动重试一次 · 仍失败提示用户刷新 ·
      410 PLAN_MASTERED（连续 3 次 ease≥2.8 已触发 mastered）→ 跳 P-REVIEW-DONE 显示"已掌握"hero。
      mutation 期间 rating-bar 三按钮 disabled + loading 状态 review.exec.rating-loading。
    source: "mockup 08_review_exec.html rating-bar · s5-business-analysis.yml SC-08.AC-1 · A1 决策（3 档映射 0/3/5）· D5 invalidate 策略"
