        - id: "error_paths.2"
          given: "JWT scope ≠ READ（异常 token · 例如学生自己的 JWT）"
          when: "进 /observer 路由"
          then: "前端守门跳到 403 错误页 · 不允许进入即使数据 fetch 也会被网关拒"
      boundary:
        - id: "boundary.0"
