# Gateway test profile · overrides for SmokeIT/RouteIT/GatewayFilterChainIT
server:
  port: 0

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  # Redis test config — overridden by @DynamicPropertySource in GatewayFilterChainIT
  data:
    redis:
      host: ${REDIS_TEST_HOST:localhost}
      port: ${REDIS_TEST_PORT:6379}
      timeout: 500ms
  cloud:
    gateway:
      routes:
        - id: wrongbook-api
          uri: http://localhost:18081
          predicates:
            - Path=/api/v1/wrongbook/**
        - id: ai-api
          uri: http://localhost:18082
          predicates:
            - Path=/api/v1/ai/**
        - id: review-api
          uri: http://localhost:18083
          predicates:
            - Path=/api/v1/review/**
        - id: file-api
          uri: http://localhost:18084
          predicates:
            - Path=/api/v1/file/**
        - id: anon-api
          uri: http://localhost:18085
          predicates:
            - Path=/api/v1/anon/**
    nacos:
      config:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: [health, info]

jwt:
  # classpath-relative PEM (copied from docs/dev at build time); RouteIT overrides via @DynamicPropertySource
  public-key-path: jwt-dev-pubkey.pem

resilience4j:
  ratelimiter:
    configs:
      default:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 0

# Test JWT secrets (≥ 32 bytes each)
longfeng:
  jwt:
    share:
      secret: test-share-secret-min32chars-xxxx
    anon:
      secret: test-anon-secret-min32chars-xxxxx
  sentinel:
    ai:
      qps: 200
  ratelimit:
    guest:
      ip:
        per-second: 5
      fp:
        per-second: 3
